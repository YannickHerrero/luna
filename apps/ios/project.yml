name: Luna
options:
  bundleIdPrefix: com.yannickherrero
  deploymentTarget:
    iOS: '18.0'
    watchOS: '11.0'
  minimumXcodeGenVersion: 2.45.0
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CODE_SIGN_STYLE: Automatic
targets:
  Luna:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.Push:
          enabled: 1
    sources:
      - path: Luna
      - path: LunaShared
        group: Shared/Snapshots
      - path: LunaWidgetShared
        group: Shared/Widgets
      - path: ../../packages/design-tokens/generated/LunaColors.swift
        group: Shared/DesignSystem/Generated
    dependencies:
      - target: LunaWidgets
      - target: LunaWatch
        embed: true
    info:
      path: Luna/Resources/Info.plist
      properties:
        CFBundleDisplayName: Luna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.yannickherrero.luna
            CFBundleURLSchemes:
              - luna
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Luna connects privately to the Luna server on your development machine.
        NSCameraUsageDescription: Luna uses the camera when you attach a new photo to a conversation.
        NSMicrophoneUsageDescription: Luna records audio only when you ask it to transcribe your voice.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yannickherrero.luna
        PRODUCT_NAME: Luna
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        CODE_SIGN_ENTITLEMENTS: Luna/Resources/Luna.entitlements
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Luna App Store
  LunaWidgets:
    type: app-extension
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: LunaWidgets
        excludes:
          - Info.plist
          - LunaWidgets.entitlements
      - path: LunaShared
        group: Shared/Snapshots
      - path: LunaWidgetShared
        group: Shared/Widgets
      - path: ../../packages/design-tokens/generated/LunaColors.swift
        group: Shared/DesignSystem/Generated
    info:
      path: LunaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Luna Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yannickherrero.luna.widgets
        PRODUCT_NAME: LunaWidgets
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: LunaWidgets/LunaWidgets.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: '1,2'
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Luna Widgets App Store
  LunaWatch:
    type: application
    platform: watchOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: LunaWatch
        excludes:
          - Info.plist
          - LunaWatch.entitlements
      - path: LunaShared
        group: Shared/Snapshots
      - path: LunaWatchWidgetShared
        group: Shared/WatchWidgets
      - path: ../../packages/design-tokens/generated/LunaColors.swift
        group: Shared/DesignSystem/Generated
    dependencies:
      - target: LunaWatchWidgets
    info:
      path: LunaWatch/Info.plist
      properties:
        CFBundleDisplayName: Luna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.yannickherrero.luna.watch
            CFBundleURLSchemes:
              - luna-watch
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.yannickherrero.luna
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yannickherrero.luna.watchkitapp
        PRODUCT_NAME: LunaWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: LunaWatch/LunaWatch.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: '4'
        WATCHOS_DEPLOYMENT_TARGET: 11.0
        WK_COMPANION_APP_BUNDLE_IDENTIFIER: com.yannickherrero.luna
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Luna Watch App Store
  LunaWatchWidgets:
    type: app-extension
    platform: watchOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: LunaWatchWidgets
        excludes:
          - Info.plist
          - LunaWatchWidgets.entitlements
      - path: LunaShared
        group: Shared/Snapshots
      - path: LunaWatchWidgetShared
        group: Shared/WatchWidgets
    info:
      path: LunaWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Luna Watch Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yannickherrero.luna.watchkitapp.widgets
        PRODUCT_NAME: LunaWatchWidgets
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: LunaWatchWidgets/LunaWatchWidgets.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: '4'
        WATCHOS_DEPLOYMENT_TARGET: 11.0
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Luna Watch Widgets App Store
  LunaWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: LunaWatchTests
    dependencies:
      - target: LunaWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yannickherrero.luna.watchtests
        GENERATE_INFOPLIST_FILE: YES
        WATCHOS_DEPLOYMENT_TARGET: 11.0
  LunaWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: LunaWatchUITests
    dependencies:
      - target: LunaWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yannickherrero.luna.watchuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LunaWatch
        WATCHOS_DEPLOYMENT_TARGET: 11.0
  LunaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LunaTests
      - path: ../../packages/protocol/tests/fixtures/project-grouping.json
        buildPhase: resources
    dependencies:
      - target: Luna
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yannickherrero.luna.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Luna.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Luna'
        BUNDLE_LOADER: '$(TEST_HOST)'
  LunaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LunaUITests
    dependencies:
      - target: Luna
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yannickherrero.luna.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Luna
schemes:
  Luna:
    build:
      targets:
        Luna: all
        LunaWidgets: all
        LunaWatch: all
        LunaTests: [test]
        LunaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: LunaTests
          parallelizable: true
        - name: LunaUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  LunaWatch:
    build:
      targets:
        LunaWatch: all
        LunaWatchWidgets: all
        LunaWatchTests: [test]
        LunaWatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: LunaWatchTests
        - name: LunaWatchUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
