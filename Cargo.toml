[workspace]
members = [
  "crates/luna-pi",
  "crates/luna-protocol",
  "crates/luna-server",
  "crates/luna-storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["json", "macros", "multipart", "ws"] }
base64 = "0.22.1"
bytes = "1.11.1"
directories = "6.0.0"
futures-util = "0.3.32"
http = "1.4.0"
rand = "0.9.2"
schemars = { version = "1.2.1", features = ["uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite", "uuid"] }
subtle = "2.6.1"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "macros", "serde"] }
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["codec", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["catch-panic", "compression-gzip", "cors", "fs", "limit", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "time", "uuid"] }
uuid = { version = "1.20.0", features = ["serde", "v4", "v7"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
